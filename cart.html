<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - MiniShop</title>
</head>
<body>
    <header class="site-header">
        <h1>MiniShop</h1>
        <nav class="main-nav">
            <a href="index.html">Trang chủ</a>
            <a href="about.html">Giới thiệu</a>
            <a href="cart.html">Giỏ hàng</a>
            <a href="login.html">Đăng nhập</a>
            <a href="register.html">Đăng ký</a>
            <a href="contact.html">Liên hệ</a>
        </nav>
    </header>

    <main>
        <h2>Giỏ hàng của bạn</h2>
        
        <table class="cart-table">
            <thead>
                <tr>
                    <th>Sản phẩm</th>
                    <th>Đơn giá</th>
                    <th>Số lượng</th>
                    <th>Thành tiền</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Chuột không dây M1</td>
                    <td>250.000 đ</td>
                    <td><input type="number" name="quantity_sp01" min="1" value="1"></td>
                    <td>250.000 đ</td>
                </tr>
                <tr>
                    <td>Bàn phím cơ K2</td>
                    <td>450.000 đ</td>
                    <td><input type="number" name="quantity_sp02" min="1" value="1"></td>
                    <td>450.000 đ</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <th colspan="3">Tổng tiền</th>
                    <th>700.000 đ</th>
                </tr>
            </tfoot>
        </table>

        <p>
            <button type="button">Đặt hàng</button>
        </p>

        <p><a href="index.html">&laquo; Tiếp tục mua hàng</a></p>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 MiniShop. Dự án thực hành lập trình web.</p>
    </footer>
</body>
</html>
